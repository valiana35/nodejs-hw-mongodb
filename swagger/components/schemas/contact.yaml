type: object
required:
  - _id
  - name
  - phoneNumber
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: "66780ea6f56d6dd346e8c7f2"
  name:
    description: "Contact's name"
    type: string
    example: "Nelly Pery"
  phoneNumber:
    description: "Contact's phoneNumber"
    type: string
    example: "+380987678875"
  email:
    description: "Contact's email"
    type: string
    example: "nelly@gmail.com"
  isFavourite:
    description: "Whether is contact favourite"
    type: boolean
    example: false
  contactType:
    description: "Contact's type. Should be work, home or personal"
    type: string
    enum: ['work', 'home', 'personal']
    default: "personal"
    example: "work"
  userId:
    description: "Contact's userId"
    type: string
    example: "6675d472b43d599e97812382"
  photo:
    description: "Link to contact's photo"
    type: string
    example: "<https://res.cloudinary.com/dhgytcvmd/image/upload/v1720030393/ep3vcwhmbjmifqnfs5dy.jpg>"
  createdAt:
    description: "Contact creation time"
    type: string
    example: "2024-06-23T12:01:42.947Z"
  updatedAt:
    description: "Contact update time"
    type: string
    example: "2024-07-03T18:13:14.571Z"
